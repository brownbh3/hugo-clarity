name: Test build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one Hugo version failing must not cancel the other's result
      matrix:
        hugo-version:
          - 'latest'
          - '0.162.1'   # fleet pin (deploy-site.yml). Was 0.143.1 — too old for hugo.Data (header.html).
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      # Newer Hugo releases need the Dart Sass binary for css.Sass (2026-11-20: 'latest' failed
      # with "no Dart Sass binary found in $PATH"). Installed for every matrix version.
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Run Hugo
        working-directory: exampleSite
        run: hugo --themesDir ../..